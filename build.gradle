// Mod Hub: a mod list and a settings home in one. Players find every
// installed mod, open its settings and pin shortcuts to it; developers declare settings once
// in common code and get a file, a screen and a value a dedicated server can read.
// Universal (`environment: "*"`): server-side settings are read from the server's own file.
//
// Repo folder and Gradle project `mod-hub` (the slug); mod id, jar and packages `modhub`.
// Build with `./gradlew :mod-hub:build` from the workspace root.

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

version = property('modhub_version')
group   = 'com.trevlar'

base.archivesName = 'modhub'

// The config-library adapters (src/compat/<name>), each with the one library version it's compiled
// against. An adapter's classes are the only ones that can reach its library; it ships inside
// Mod Hub's jar and loads only when that library is installed and inside the range it was checked
// against (page/Adapter, page/Pages). Updating one: bump its version here, build (an API change
// fails here), run its Test Gallery scene, widen its testedRange, and add a row to the table in
// the design doc.
ext.compat = [
        yacl       : 'maven.modrinth:yacl:3.9.7+26.3-fabric',
        midnightlib: 'maven.modrinth:midnightlib:1.10.0+26.3-fabric',
]

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // Not for this mod: Keybindery (dev runtime only, below) depends on YACL, whose builds are
    // only on this Maven repository, so Gradle needs it to resolve Keybindery's runtime classpath.
    maven { url 'https://api.modrinth.com/maven' }
}

// MenuKit's client source set must exist before this project reads it, and Keybindery's.
evaluationDependsOn(':menukit')
evaluationDependsOn(':keybindery')

dependencies {
    // 26.x: the game is unobfuscated, so no mappings line and plain java configurations.
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // MenuKit draws every screen and the shortcut row.
    implementation project(':menukit')

    // Mod Menu: optional. When it's installed, Mod Hub opens third-party mods' screens through
    // its public ModMenu.getConfigScreen; without it, through the stand-in below. In the dev
    // runtime so the Mod Menu path can be tried.
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    localRuntime "com.terraformersmc:modmenu:21.0.0"

    compileOnly 'org.jetbrains:annotations:24.1.0'

    // The settings file's self-check (src/test).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

loom {
    // Anything that touches a screen lives in src/client. src/main runs on both sides, and the
    // compiler refuses a main class that reaches a client one: that's what keeps a mod's
    // settings readable on a dedicated server.
    splitEnvironmentSourceSets()
}

// Two example mods for the dev runtime and Test Gallery only, never shipped: they're in one
// suite, so the mod list and the config screen have something real to show beyond Mod Hub.
// Dev-only source sets inside this repo. Move them to their own project if they grow.
sourceSets {
    exampleLumber {
        java.srcDirs = ['src/examples/lumber/java']
        resources.srcDirs = ['src/examples/lumber/resources']
        compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
    }
    exampleMining {
        java.srcDirs = ['src/examples/mining/java']
        resources.srcDirs = ['src/examples/mining/resources']
        compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
    }
    // Mod Menu's API types, for when Mod Menu isn't installed: built into their own small mod,
    // nested in Mod Hub's jar, which the loader drops whenever the real Mod Menu is there
    // (it declares `breaks: modmenu`). Compiled without Mod Menu on the classpath, so it can't
    // lean on anything of Mod Menu's but the five types it copies.
    modmenuApi {
        java.srcDirs = ['src/modmenuApi/java']
        resources.srcDirs = ['src/modmenuApi/resources']
    }
    // A production-shaped check of the gear, never shipped: see the prodCheck tasks below.
    prodcheck {
        java.srcDirs = ['src/prodcheck/java']
        resources.srcDirs = ['src/prodcheck/resources']
        compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
    }
    // One source set per adapter: see `compat` at the top of this file.
    compat.each { name, library ->
        create("compat${name.capitalize()}") {
            java.srcDirs = ["src/compat/${name}/java"]
            compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
        }
    }
    // No sources: the classpath the dev client runs on, Mod Hub plus both examples.
    devRun {
        runtimeClasspath += client.runtimeClasspath + main.output + client.output +
                exampleLumber.output + exampleMining.output
        compat.each { name, library -> runtimeClasspath += sourceSets["compat${name.capitalize()}"].output }
    }
}

loom {
    mods {
        'modhub' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            compat.each { name, library -> sourceSet sourceSets["compat${name.capitalize()}"] }
        }
        'modhub_example_lumber' { sourceSet sourceSets.exampleLumber }
        'modhub_example_mining' { sourceSet sourceSets.exampleMining }
    }
    runs {
        client {
            ideConfigGenerated = false
            source sourceSets.devRun
        }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

// Declared after loom {} so the client source set exists. MenuKit splits its source sets too,
// so its client half is added here. A published jar holds both halves.
dependencies {
    clientImplementation rootProject.project(':menukit').sourceSets.client.output
    clientCompileOnly "com.terraformersmc:modmenu:21.0.0"

    // Keybindery: optional. The keys button opens its Key Binds screen filtered to a mod, through
    // keybindery-api (1.2.2: openModKeybinds, hasKeybinds), behind isModLoaded. Compile-only, so
    // players needn't have it; Keybindery in the dev runtime so the button can be tried.
    clientCompileOnly project(':keybindery-api')

    // The adapters' libraries, at the versions each adapter is built against (compile only: a
    // player brings their own). In the dev runtime too, for the example mods that use them.
    compat.each { name, library ->
        add("compat${name.capitalize()}CompileOnly", library)
        devRunRuntimeOnly library
    }
    devRunRuntimeOnly project(':keybindery')
    devRunRuntimeOnly rootProject.project(':keybindery').sourceSets.client.output
}

// The stand-in's own compile classpath is the client's, minus Mod Menu itself.
sourceSets.modmenuApi.compileClasspath += sourceSets.client.compileClasspath.filter { !it.name.startsWith('modmenu') }

// The stand-in as a jar of its own, nested in Mod Hub's under META-INF/jars and named in Mod Hub's
// fabric.mod.json "jars", the way Fabric loads any jar-in-jar mod.
def modmenuApiJar = tasks.register('modmenuApiJar', Jar) {
    archiveFileName = 'modhub-modmenu-api.jar'
    destinationDirectory = layout.buildDirectory.dir('nested')
    from sourceSets.modmenuApi.output
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
    from(modmenuApiJar) { into 'META-INF/jars' }
    compat.each { name, library -> from sourceSets["compat${name.capitalize()}"].output }
}

processModmenuApiResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// Stamp the real project version into fabric.mod.json at build; a hardcoded manifest version
// silently breaks every dependency gate against this mod.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// The shipped jar must report the bumped version.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// Kit version range check (menukit depend range vs menukit_version): the workspace root
// build.gradle supplies this for every consumer, reaching in by task name and registering one
// itself if a consumer defines none. Nothing to do here.

// Production check of the gear: boots a real Fabric client on Mod Hub's built jar plus every jar
// in -PprodCheckMods=<folder> (a launcher profile's mods folder, read only), runs the client
// gametest in src/prodcheck, logs "MHCHECK" lines and screenshots each opened screen into
// build/prodcheck/<task>/screenshots. Once with Mod Menu, once with its jar left out.
//   ./gradlew :mod-hub:prodCheckWithModMenu :mod-hub:prodCheckWithoutModMenu -PprodCheckMods=...
configurations { prodcheckGametest }
dependencies {
    prodcheckCompileOnly fabricApi.module('fabric-client-gametest-api-v1', property('fabric_version'))
    prodcheckGametest(fabricApi.module('fabric-client-gametest-api-v1', property('fabric_version'))) { transitive = false }
}
def prodcheckJar = tasks.register('prodcheckJar', Jar) {
    archiveFileName = 'modhub-prodcheck.jar'
    destinationDirectory = layout.buildDirectory.dir('prodcheck')
    from sourceSets.prodcheck.output
}
['WithModMenu': true, 'WithoutModMenu': false].each { name, withModMenu ->
    tasks.register("prodCheck${name}", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        def folder = providers.gradleProperty('prodCheckMods')
        mods.from(tasks.named('jar'), prodcheckJar, configurations.prodcheckGametest)
        mods.from(folder.map { fileTree(it) { include '*.jar'; exclude 'modhub-*'; if (!withModMenu) exclude 'modmenu-*' } })
        jvmArgs.add('-Dfabric.client.gametest')
        runDir = layout.buildDirectory.dir("prodcheck/${name}")
    }
}
